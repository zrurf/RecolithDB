syntax = "proto3";

package recolith.protocol.v1;

// Metadata carried by every data-plane request.
message RequestMeta {
  uint64 deadline_unix_micros = 1;
  uint64 catalog_generation = 2;
  bytes trace_id = 3;
  bytes idempotency_key = 4;
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  AUTH_METHOD_NONE = 1;
  AUTH_METHOD_BEARER = 2;
}

enum AuthResult {
  AUTH_RESULT_UNSPECIFIED = 0;
  AUTH_RESULT_OK = 1;
  AUTH_RESULT_FAILED = 2;
}

enum SecurityMode {
  SECURITY_MODE_UNSPECIFIED = 0;
  SECURITY_MODE_NONE = 1;
  SECURITY_MODE_TLS13 = 2;
}

message HelloRequest {
  uint32 protocol_min_major = 1;
  uint32 protocol_min_minor = 2;
  uint32 protocol_max_major = 3;
  uint32 protocol_max_minor = 4;
  string client_id = 5;
  string client_version = 6;
  AuthMethod auth_method = 7;
  bytes auth_token = 8;
  uint64 features = 9;
  uint32 max_frame_size = 10;
  uint32 max_batch_subframes = 11;
  uint32 max_batch_bytes = 12;
  uint32 compression_algorithms = 13;
  uint32 compression_threshold = 14;
  uint32 encodings = 15;
}

message WelcomeResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string server_version = 3;
  bytes session_id = 4;
  AuthResult auth_result = 5;
  uint64 features = 6;
  uint32 max_frame_size = 7;
  uint32 max_batch_subframes = 8;
  uint32 max_batch_bytes = 9;
  uint32 compression_algorithm = 10;
  uint32 compression_threshold = 11;
  uint32 max_decompressed_size = 12;
  uint32 selected_encoding = 13;
  uint64 catalog_generation = 14;
  uint64 server_time_unix_micros = 15;
  SecurityMode security = 16;
}

message PingRequest {
  bytes payload = 1;
}

message PingResponse {
  bytes payload = 1;
}

message ErrorResponse {
  string message = 1;
  bool retryable = 2;
  uint64 retry_after_millis = 3;
  uint64 catalog_generation = 4;
  map<string, string> details = 5;
}

message GoAway {
  string message = 1;
  uint64 retry_after_millis = 2;
}

message Value {
  oneof kind {
    bool bool_value = 1;
    sint32 i32_value = 2;
    sint64 i64_value = 3;
    uint32 u32_value = 4;
    uint64 u64_value = 5;
    float f32_value = 6;
    double f64_value = 7;
    string string_value = 8;
    bytes bytes_value = 9;
    uint64 timestamp_micros = 10;
    uint64 duration_micros = 11;
    uint32 enum_value = 12;
    ListValue list_value = 13;
    MapValue map_value = 14;
    RecordValue record_value = 15;
  }
}

message ListValue {
  repeated Value values = 1;
}

message MapValue {
  repeated MapEntry entries = 1;
}

message MapEntry {
  Value key = 1;
  Value value = 2;
}

message RecordValue {
  repeated FieldValue fields = 1;
}

message FieldValue {
  uint32 field_id = 1;
  Value value = 2;
}

message FieldSelection {
  uint32 fragment_id = 1;
  uint32 field_id = 2;
}

message FragmentPayload {
  uint32 fragment_id = 1;
  bytes subkey = 2;
  repeated FieldValue fields = 3;
  optional uint64 if_match = 4;
}

message FragmentResult {
  uint32 fragment_id = 1;
  bytes subkey = 2;
  uint64 commit_ts = 3;
  repeated FieldValue fields = 4;
}

message FragmentVersion {
  uint32 fragment_id = 1;
  bytes subkey = 2;
  uint64 commit_ts = 3;
}

message DocumentGetRequest {
  RequestMeta meta = 1;
  uint64 collection_id = 2;
  uint32 partition = 3;
  bytes document_key = 4;
  repeated uint32 fragments = 5;
  repeated FieldSelection projection = 6;
}

message DocumentGetResponse {
  bytes document_key = 1;
  repeated FragmentResult fragments = 2;
}

message DocumentPutRequest {
  RequestMeta meta = 1;
  uint64 collection_id = 2;
  uint32 partition = 3;
  bytes document_key = 4;
  repeated FragmentPayload fragments = 5;
}

message DocumentPutResponse {
  uint64 commit_ts = 1;
  repeated FragmentVersion versions = 2;
}

message NamedParameter {
  string name = 1;
  Value value = 2;
}

message QueryRequest {
  RequestMeta meta = 1;
  uint32 partition = 2;
  string rql = 3;
  repeated NamedParameter parameters = 4;
  uint64 limit = 5;
}

message DocumentResult {
  bytes document_key = 1;
  repeated FragmentResult fragments = 2;
}

message QueryResponse {
  repeated DocumentResult documents = 1;
}

enum KeyFieldType {
  KEY_FIELD_TYPE_UNSPECIFIED = 0;
  KEY_FIELD_TYPE_U64 = 1;
  KEY_FIELD_TYPE_I64 = 2;
  KEY_FIELD_TYPE_STRING = 3;
  KEY_FIELD_TYPE_BYTES = 4;
  KEY_FIELD_TYPE_UUID = 5;
}

enum FragmentCardinality {
  FRAGMENT_CARDINALITY_UNSPECIFIED = 0;
  FRAGMENT_CARDINALITY_ONE = 1;
  FRAGMENT_CARDINALITY_MANY = 2;
}

enum SchemaScalarType {
  SCHEMA_SCALAR_TYPE_UNSPECIFIED = 0;
  SCHEMA_SCALAR_TYPE_BOOL = 1;
  SCHEMA_SCALAR_TYPE_I32 = 2;
  SCHEMA_SCALAR_TYPE_I64 = 3;
  SCHEMA_SCALAR_TYPE_U32 = 4;
  SCHEMA_SCALAR_TYPE_U64 = 5;
  SCHEMA_SCALAR_TYPE_F32 = 6;
  SCHEMA_SCALAR_TYPE_F64 = 7;
  SCHEMA_SCALAR_TYPE_STRING = 8;
  SCHEMA_SCALAR_TYPE_BYTES = 9;
  SCHEMA_SCALAR_TYPE_TIMESTAMP = 10;
  SCHEMA_SCALAR_TYPE_DURATION = 11;
}

enum IndexKind {
  INDEX_KIND_UNSPECIFIED = 0;
  INDEX_KIND_EQUALITY = 1;
  INDEX_KIND_RANGE = 2;
  INDEX_KIND_COMPOSITE = 3;
  INDEX_KIND_UNIQUE = 4;
}

message SchemaList {
  SchemaType element = 1;
}

message SchemaMap {
  SchemaType key = 1;
  SchemaType value = 2;
}

message SchemaEnum {
  string name = 1;
  repeated string variants = 2;
}

message SchemaRecord {
  string name = 1;
  repeated SchemaField fields = 2;
}

message SchemaType {
  oneof kind {
    SchemaScalarType scalar = 1;
    SchemaList list = 2;
    SchemaMap map = 3;
    SchemaEnum enum_type = 4;
    SchemaRecord record = 5;
  }
}

message SchemaField {
  uint32 id = 1;
  string name = 2;
  bool optional = 3;
  SchemaType type = 4;
}

message KeyFieldMetadata {
  string name = 1;
  KeyFieldType type = 2;
}

message FragmentMetadata {
  uint32 id = 1;
  string name = 2;
  FragmentCardinality cardinality = 3;
  uint64 bucket_id = 4;
  uint64 schema_id = 5;
  uint32 schema_version = 6;
  repeated SchemaField fields = 7;
}

message IndexMetadata {
  uint64 id = 1;
  uint64 bucket_id = 2;
  string name = 3;
  IndexKind kind = 4;
  repeated uint32 fields = 5;
}

message CollectionMetadata {
  uint64 id = 1;
  uint32 keyspace_id = 2;
  string keyspace = 3;
  string name = 4;
  string affinity_group = 5;
  repeated KeyFieldMetadata key_fields = 6;
  repeated FragmentMetadata fragments = 7;
  repeated IndexMetadata indexes = 8;
}

message DescribeCollectionRequest {
  RequestMeta meta = 1;
  string keyspace = 2;
  oneof target {
    uint64 collection_id = 3;
    string collection_name = 4;
  }
}

message DescribeCollectionResponse {
  uint64 catalog_generation = 1;
  CollectionMetadata collection = 2;
}

enum BucketPolicy {
  BUCKET_POLICY_UNSPECIFIED = 0;
  BUCKET_POLICY_STRICT = 1;
  BUCKET_POLICY_MANAGED = 2;
  BUCKET_POLICY_RAW = 3;
}

message KeyspaceDefinition {
  uint32 id = 1;
  string name = 2;
}

message SchemaDefinition {
  uint64 id = 1;
  uint32 version = 2;
  string idl = 3;
}

message BucketDefinition {
  uint64 id = 1;
  uint32 keyspace_id = 2;
  string name = 3;
  uint32 partitions = 4;
  BucketPolicy policy = 5;
  uint64 schema_id = 6;
  uint32 schema_version = 7;
}

message KeyFieldDefinition {
  string name = 1;
  KeyFieldType type = 2;
}

message FragmentDefinition {
  uint32 id = 1;
  string name = 2;
  uint64 bucket_id = 3;
  FragmentCardinality cardinality = 4;
}

message CollectionDefinition {
  uint64 id = 1;
  uint32 keyspace_id = 2;
  string name = 3;
  string affinity_group = 4;
  repeated KeyFieldDefinition key_fields = 5;
  repeated FragmentDefinition fragments = 6;
}

message IndexDefinition {
  uint64 id = 1;
  uint64 bucket_id = 2;
  string name = 3;
  IndexKind kind = 4;
  repeated uint32 fields = 5;
}

message CatalogApplyRequest {
  RequestMeta meta = 1;
  repeated KeyspaceDefinition keyspaces = 2;
  repeated SchemaDefinition schemas = 3;
  repeated BucketDefinition buckets = 4;
  repeated CollectionDefinition collections = 5;
  repeated IndexDefinition indexes = 6;
}

message CatalogApplyResponse {
  uint64 catalog_generation = 1;
}
